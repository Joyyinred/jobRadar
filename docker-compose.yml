services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: jobradar
      POSTGRES_USER: jobradar
      POSTGRES_PASSWORD: jobradar
    ports:
      # 5434 on the host: 5432 is taken by a native PostgreSQL install and
      # 5433 by the CarePlan project. Inside the compose network it is 5432.
      - "5434:5432"
    volumes:
      # Named volume: data survives `docker compose down`.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobradar"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    # Day 4: the message queue. Just a box that holds ad ids until someone
    # takes them. It does no work by itself.
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Inside the compose network the database is reachable by service name.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: jobradar
      POSTGRES_USER: jobradar
      POSTGRES_PASSWORD: jobradar
      # Inside the compose network Redis is reachable by service name too.
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        # Wait until Postgres accepts connections, not just until it exists.
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Mount the source so edits reload without rebuilding the image.
      - .:/app

  worker:
    # Day 5: same image and code as web, different command. It never serves
    # HTTP — it just takes ad ids off the Redis queue and parses them.
    # --concurrency=4: up to 4 ads parsed at the same time.
    # --pool=threads (Day 11): 4 threads in ONE process instead of 4 processes,
    # so they share one set of metrics. Fine here: the worker mostly waits on
    # the LLM's network reply, which threads handle well.
    # Its metrics are on :9100 inside the compose network (Prometheus reads them).
    # (The hand-written version was: python manage.py run_worker)
    build: .
    command: celery -A config worker --loglevel=info --concurrency=4 --pool=threads
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: jobradar
      POSTGRES_USER: jobradar
      POSTGRES_PASSWORD: jobradar
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  prometheus:
    # Day 11: collects the numbers. Every 15s it fetches /metrics from web and
    # :9100 from the worker (monitoring/prometheus.yml) and stores them.
    # Its own UI: http://localhost:9090
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - web
      - worker

  grafana:
    # Day 11: draws the graphs. The data source and the JobRadar dashboard are
    # loaded from monitoring/grafana/ at start-up — nothing to click together.
    # http://localhost:3000 (local only: anonymous viewing on, admin/admin)
    image: grafana/grafana:12.1.1
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  prometheus-data:
  grafana-data:
