<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>JobRadar</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    textarea { width: 100%; height: 260px; font: inherit; }
    button { margin-top: .5rem; padding: .5rem 1rem; font: inherit; }
    #status { margin-top: 1rem; font-weight: bold; }
    table { border-collapse: collapse; margin-top: 1rem; }
    td { border: 1px solid #ccc; padding: .4rem .8rem; vertical-align: top; }
    td:first-child { font-weight: bold; }
  </style>
</head>
<body>
  <h1>JobRadar</h1>
  <p>Paste one job ad (Swedish or English) and submit.</p>

  <textarea id="raw_text" placeholder="Paste the job ad here..."></textarea>
  <br>
  <input id="source_url" type="url" placeholder="Where you found it (optional URL)" style="width: 100%; margin-top: .5rem; font: inherit;">
  <br>
  <button id="submit">Parse ad</button>

  <div id="status"></div>
  <div id="result"></div>

  <h2>Your ads</h2>
  <ul id="ad-list"></ul>

  <script>
    const button = document.getElementById("submit");
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");

    // Read the form ONCE, at click time.
    button.addEventListener("click", () => submitAd({
      raw_text: document.getElementById("raw_text").value,
      source_url: document.getElementById("source_url").value,
      confirm: false,
    }));

    // POST /api/ads/ with exactly this body.
    async function submitAd(body) {
      // A new submission takes over the page: stop any earlier ad's polling,
      // or it would overwrite this answer (e.g. a warning) when it finishes.
      pollingId = null;
      button.disabled = true;
      resultEl.innerHTML = "";
      statusEl.textContent = "Submitting...";

      let response, data;
      try {
        response = await fetch("/api/ads/", {
          method: "POST",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify(body),
        });
        data = await response.json();
      } catch (err) {
        // Network down, server restarting, or a non-JSON reply (e.g. a proxy's
        // HTML error page). Without this, the button would stay disabled.
        statusEl.textContent = "Error:";
        resultEl.textContent = "Could not reach the server. Please try again.";
        return;
      } finally {
        button.disabled = false;  // runs on every path, including the return above
      }

      // Day 8 Part 2: every error has the same shape {type, code, message, detail},
      // so ONE branch handles all of them.
      if (!response.ok) {
        // Confirming re-sends the SAME body that was warned about — not whatever
        // is in the textarea by the time the user clicks.
        showError(data, () => submitAd({ ...body, confirm: true }));
        return;
      }

      // 200 + duplicate — the ad we already have.
      if (data.duplicate) {
        render(data);
        statusEl.textContent = `Already submitted as ad #${data.id} (${data.status})`;
        if (data.status === "pending" || data.status === "processing") pollUntilDone(data.id);
        return;
      }

      // 202 — new ad, queued. The worker parses it later.
      statusEl.textContent = `Ad #${data.id}: ${data.status} — received, parsing in the background`;
      loadList();  // the new ad should now appear in the list
      pollUntilDone(data.id);  // Day 6: keep asking until it's done
    }

    // ---- Day 8: the one error handler --------------------------------------
    // Works for every API error, because the backend always sends
    // {type, code, message, detail}. `type` decides what the user can do next.
    function showError(error, onConfirm) {
      const titles = { validation: "Please fix:", not_found: "Not found:", block: "Not allowed:", warning: "Warning:" };
      statusEl.textContent = titles[error.type] ?? "Error:";
      resultEl.textContent = error.message + " ";
      // A warning can be overridden: offer to send the same request with confirm.
      if (error.type === "warning" && onConfirm) {
        const confirmButton = document.createElement("button");
        confirmButton.textContent = "Continue anyway";
        confirmButton.addEventListener("click", onConfirm);
        resultEl.appendChild(confirmButton);
      }
    }

    // ---- Day 6: polling ----------------------------------------------------
    // The backend can't call the browser ("you're done!"); HTTP only lets the
    // browser ask. So the browser asks every 3 seconds: "done yet?"
    const POLL_INTERVAL_MS = 3000;
    const MAX_POLLS = 40;  // 40 x 3s = 2 minutes. A dead worker must not mean polling forever.

    let pollingId = null;  // which ad we're currently polling (null = none)

    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    async function pollUntilDone(id) {
      pollingId = id;
      for (let attempt = 1; attempt <= MAX_POLLS; attempt++) {
        await sleep(POLL_INTERVAL_MS);

        // The user submitted another ad or clicked one in the list meanwhile:
        // stop, so this loop doesn't overwrite what they're looking at now.
        if (pollingId !== id) return;

        // Same endpoint as the details view: GET /api/ads/<id>/
        const response = await fetch(`/api/ads/${id}/`, { headers: { Accept: "application/json" } });
        const data = await response.json();

        if (data.status === "completed" || data.status === "failed") {
          pollingId = null;
          render(data);  // completed -> the fields; failed -> the error
          loadList();    // the list shows the new title and status too
          return;
        }
        // pending / processing: say so, and go round again.
        statusEl.textContent = `Ad #${id}: ${data.status} (checked ${attempt}x, every ${POLL_INTERVAL_MS / 1000}s)`;
      }
      pollingId = null;
      statusEl.textContent = `Ad #${id}: still not done after 2 minutes. Refresh later to check.`;
    }

    // GET /api/ads/ — the list. One <li> per ad; click it to see the details.
    async function loadList() {
      const response = await fetch("/api/ads/", { headers: { Accept: "application/json" } });
      const ads = await response.json();

      const list = document.getElementById("ad-list");
      list.innerHTML = "";
      for (const ad of ads) {
        const li = document.createElement("li");
        li.style.cursor = "pointer";
        li.textContent = `#${ad.id} ${ad.title ?? "(no title)"} — ${ad.company ?? "?"} [${ad.status}]`;
        li.addEventListener("click", () => showAd(ad.id));
        list.appendChild(li);
      }
    }

    // GET /api/ads/<id>/ — the details endpoint you wrote.
    async function showAd(id) {
      pollingId = null;  // the user is looking at something else now; stop polling
      const response = await fetch(`/api/ads/${id}/`, { headers: { Accept: "application/json" } });
      const data = await response.json();
      render(data);
      // Opened an ad that isn't finished yet? Keep watching it too.
      if (data.status === "pending" || data.status === "processing") {
        pollUntilDone(id);
      }
    }

    // Draw one ad's status and result (or error). Used by showAd and polling.
    function render(data) {
      statusEl.textContent = `Ad #${data.id}: ${data.status}`;
      resultEl.innerHTML = "";
      if (data.status === "completed") {
        showResult(data.result);
      } else {
        resultEl.textContent = data.error ?? "";
      }
      // Failed? Offer a retry instead of making the user paste the ad again.
      if (data.status === "failed") {
        const retryButton = document.createElement("button");
        retryButton.textContent = "Retry";
        retryButton.addEventListener("click", () => retryAd(data.id));
        resultEl.append(" ", retryButton);
      }
    }

    // POST /api/ads/<id>/retry/ — re-queue a failed ad, then poll it like a new one.
    async function retryAd(id) {
      const response = await fetch(`/api/ads/${id}/retry/`, {
        method: "POST",
        headers: { Accept: "application/json" },
      });
      const data = await response.json();
      if (!response.ok) {
        showError(data);  // 409 (not failed any more) or 404 — same handler as everything else
        return;
      }
      resultEl.innerHTML = "";
      statusEl.textContent = `Ad #${id}: pending — retry queued`;
      loadList();
      pollUntilDone(id);
    }

    loadList();  // fill the list as soon as the page opens

    function showResult(result) {
      const table = document.createElement("table");
      for (const [key, value] of Object.entries(result)) {
        const row = table.insertRow();
        row.insertCell().textContent = key;
        // textContent (not innerHTML) so text from the ad can't inject HTML.
        row.insertCell().textContent = Array.isArray(value) ? value.join(", ") : value;
      }
      resultEl.appendChild(table);
    }
  </script>
</body>
</html>
